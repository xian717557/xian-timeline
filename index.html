<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>西安城市发展时间线</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.control.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ✨ 大屏模式退出按钮 -->
    <button id="exit-dashboard-btn">✖ 退出大屏</button>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>正在计算城市发展热度...</div>
    </div>

    <header id="top-bar">
        <h1>🗺️ 西安城市发展档案</h1>
        <div class="controls">
            <input type="text" id="search-input" placeholder="搜索关键词...">
            <div class="category-filters">
                <label><input type="checkbox" class="cat-filter" value="交通" checked> <span style="color:#007bff;">交通</span></label>
                <label><input type="checkbox" class="cat-filter" value="规划" checked> <span style="color:#dc3545;">规划</span></label>
                <label><input type="checkbox" class="cat-filter" value="文化" checked> <span style="color:#28a745;">文化</span></label>
                <label><input type="checkbox" class="cat-filter" value="经济" checked> <span style="color:#6f42c1;">经济</span></label>
                <label><input type="checkbox" class="cat-filter" value="生态" checked> <span style="color:#17a2b8;">生态</span></label>
                <label><input type="checkbox" class="cat-filter" value="区划" checked> <span style="color:#fd7e14;">区划</span></label>
                <label><input type="checkbox" class="cat-filter" value="政策" checked> <span style="color:#e83e8c;">政策</span></label>
            </div>
            <label class="heat-toggle">
                <input type="checkbox" id="heat-mode-toggle"> 🔥 热力图
            </label>
            
            <!-- ✨ 新增按钮 -->
            <button id="policy-btn" class="action-btn">📑 政策库</button>
            <button id="fullscreen-btn" class="action-btn">🖥️ 大屏模式</button>
        </div>
        <div id="stats-text">加载中...</div>
    </header>

    <div id="side-panel">
        <div id="close-panel">×</div>
        <img id="panel-img" src="" alt="历史图片">
        <h2 id="panel-title"></h2>
        <div class="panel-meta">
            <span id="panel-year"></span>
            <span id="panel-category"></span>
            <span>来源：<span id="panel-source"></span></span>
        </div>
        <p id="panel-desc"></p>
        <a id="panel-link" href="#" target="_blank" style="display:none; margin-top:15px; padding:8px 15px; background:#007bff; color:#fff; text-decoration:none; border-radius:5px; font-size:14px; text-align:center;">阅读原文</a>
    </div>

    <!-- ✨ 新增：政策库弹窗 -->
    <div id="policy-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📑 西安市政府政策文档库</h2>
                <span id="close-policy" class="close-btn">&times;</span>
            </div>
            <div class="policy-list" id="policy-list-container">
                <!-- 列表由 JS 动态生成 -->
            </div>
        </div>
    </div>

    <div id="map"></div>
    
    <div id="bottom-panel">
        <div id="bar-chart"></div>
        <div id="pie-chart"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/iso8601-js-period@0.2.1/iso8601.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="main.js"></script>
</body>
</html>
