<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西安城市发展时间线</title>
    
    <!-- 1. Leaflet 核心样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 2. TimeDimension 插件样式和依赖 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.control.min.css" />
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <!-- 地图容器 -->
    <div id="map"></div>

    <!-- 3. Leaflet 核心 JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 4. TimeDimension 插件依赖的 JS -->
    <script src="https://cdn.jsdelivr.net/npm/iso8601-js-period@0.2.1/iso8601.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.min.js"></script>
    
    <!-- 5. 我们的业务代码 -->
    <script>
        // 初始化地图，启用时间维度控件
        const map = L.map('map', {
            center: [34.3416, 108.9398],
            zoom: 11,
            timeDimension: true,
            timeDimensionControl: true,
            timeDimensionControlOptions: {
                position: 'bottomleft',
                autoPlay: false,
                minSpeed: 1,
                maxSpeed: 10,
                timeSliderDragUpdate: true,
                loop: false
            }
        });

        // 添加底图
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // 将 events 数组转换为 GeoJSON
        function eventsToGeoJSON(events) {
            return {
                type: 'FeatureCollection',
                features: events.map(e => ({
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [e.lng, e.lat]
                    },
                    properties: {
                        time: `${e.year}-01-01`,
                        title: e.title,
                        year: e.year,
                        category: e.category,
                        desc: e.desc,
                        source: e.source
                    }
                }))
            };
        }

        // 加载数据并渲染
        fetch('events.json')
            .then(response => response.json())
            .then(events => {
                const geojsonData = eventsToGeoJSON(events);

                const geoJsonLayer = L.geoJSON(geojsonData, {
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties;
                        const popupHTML = `
                            <b>${p.year} · ${p.title}</b><br>
                            ${p.desc}<br>
                            <small>来源：${p.source}</small>
                        `;
                        layer.bindPopup(popupHTML);
                        layer.bindTooltip(`${p.year} · ${p.title}`);
                    }
                });

                // 包装成时间图层
                const timeLayer = L.timeDimension.layer.geoJson(geoJsonLayer, {
                    updateTimeDimension: true,
                    addlastPoint: true,
                    waitForReady: true
                });

                timeLayer.addTo(map);
            })
            .catch(error => console.error('加载 events.json 失败:', error));
    </script>
</body>
</html>
