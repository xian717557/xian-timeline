<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西安城市发展时间线</title>
    
    <!-- 引入 Leaflet 核心样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- 引入 TimeDimension 插件样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.control.min.css" />
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            font-family: sans-serif; 
        }
        #map { 
            height: 65vh; 
            width: 100%; 
        }
        #chart { 
            height: 35vh; 
            width: 100%; 
            background: #fff; 
        }
        /* 右上角图例样式 */
        .legend {
            background: white; 
            padding: 10px; 
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4); 
            line-height: 1.5; 
            font-size: 14px;
        }
        .legend i { 
            width: 12px; 
            height: 12px; 
            float: left; 
            margin-right: 8px; 
            margin-top: 4px; 
            border-radius: 50%; 
        }
    </style>
</head>
<body>
    <!-- 左上角搜索框 -->
    <div id="search-container" style="position: absolute; top: 10px; left: 60px; z-index: 1000; background: white; padding: 10px; border-radius: 5px; box-shadow: 0 1px 5px rgba(0,0,0,0.4);">
        <input type="text" id="search-input" placeholder="搜索关键词（如：地铁、规划）..." style="width: 250px; padding: 5px; border: 1px solid #ccc; border-radius: 3px; outline: none;">
    </div>

    <!-- 地图和图表容器 -->
    <div id="map"></div>
    <div id="chart"></div>

    <!-- 引入各种库 -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/iso8601-js-period@0.2.1/iso8601.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    
    <script>
        // ==========================================
        // 1. 初始化地图与时间轴
        // ==========================================
        const map = L.map('map', {
            center: [34.3416, 108.9398],
            zoom: 11,
            timeDimension: true,
            timeDimensionControl: true,
            timeDimensionControlOptions: {
                position: 'bottomleft', 
                autoPlay: false, 
                minSpeed: 1, 
                maxSpeed: 10,
                timeSliderDragUpdate: true, 
                loop: false
            }
        });

        // 使用国内极速的高德地图底图
        L.tileLayer('https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
            maxZoom: 19, 
            attribution: '© 高德地图'
        }).addTo(map);

        // ==========================================
        // 2. 初始化 ECharts 实例
        // ==========================================
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        
        let allEvents = [];
        let currentTimeLayer = null;
        let currentGeoJsonLayer = null;

        // ==========================================
        // 3. 事件分类颜色映射
        // ==========================================
        function getColor(category) {
            if (category === '交通') return '#007bff'; // 蓝
            if (category === '规划') return '#dc3545'; // 红
            if (category === '文化') return '#28a745'; // 绿
            return '#6c757d';
        }

        // ==========================================
        // 4. 图表数据更新
        // ==========================================
        function updateChartData(eventsArray) {
            const yearCounts = {};
            eventsArray.forEach(e => { 
                yearCounts[e.year] = (yearCounts[e.year] || 0) + 1; 
            });
            
            const years = Object.keys(yearCounts).sort((a, b) => a - b);
            const counts = years.map(y => yearCounts[y]);
            const currentYear = new Date(map.timeDimension.getCurrentTime()).getFullYear();

            const option = {
                title: { 
                    text: '西安城市发展事件年份分布', 
                    left: 'center', 
                    textStyle: { fontSize: 14 } 
                },
                tooltip: { trigger: 'axis' },
                grid: { 
                    left: '5%', 
                    right: '5%', 
                    bottom: '10%', 
                    top: '20%', 
                    containLabel: true 
                },
                xAxis: { 
                    type: 'category', 
                    data: years, 
                    axisLabel: { interval: 0 } 
                },
                yAxis: { 
                    type: 'value', 
                    minInterval: 1 
                },
                series: [{
                    name: '事件数', 
                    type: 'bar', 
                    data: counts, 
                    barMaxWidth: 40,
                    itemStyle: {
                        color: function(params) {
                            const year = parseInt(years[params.dataIndex]);
                            return year <= currentYear ? '#5470c6' : '#e0e0e0';
                        }
                    }
                }]
            };
            myChart.setOption(option, true);
        }

        // ==========================================
        // 5. 数据转 GeoJSON 格式
        // ==========================================
        function eventsToGeoJSON(events) {
            return {
                type: 'FeatureCollection',
                features: events.map(e => ({
                    type: 'Feature',
                    geometry: { 
                        type: 'Point', 
                        coordinates: [e.lng, e.lat] 
                    },
                    properties: { 
                        time: `${e.year}-01-01`, 
                        title: e.title, 
                        year: e.year, 
                        category: e.category, 
                        desc: e.desc, 
                        source: e.source, 
                        image: e.image 
                    }
                }))
            };
        }

        // ==========================================
        // 6. 核心渲染逻辑（含图片弹窗）
        // ==========================================
        function renderData(eventsArray) {
            if (currentTimeLayer) { map.removeLayer(currentTimeLayer); }
            if (currentGeoJsonLayer) { map.removeLayer(currentGeoJsonLayer); }

            updateChartData(eventsArray);
            const geojsonData = eventsToGeoJSON(eventsArray);

            currentGeoJsonLayer = L.geoJSON(geojsonData, {
                pointToLayer: function (feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 8, 
                        fillColor: getColor(feature.properties.category),
                        color: '#fff', 
                        weight: 2, 
                        opacity: 1, 
                        fillOpacity: 0.8
                    });
                },
                onEachFeature: function (feature, layer) {
                    const p = feature.properties;
                    // 加了 referrerpolicy 绕过防盗链
                    let imageTag = p.image ? `<img src="${p.image}" referrerpolicy="no-referrer" style="width: 100%; height: 140px; object-fit: cover; border-radius: 4px; margin-bottom: 8px;">` : '';
                    
                    const popupHTML = `
                        <div style="max-width: 240px; font-family: sans-serif;">
                            ${imageTag}
                            <b style="font-size: 15px; color: #333;">${p.year} · ${p.title}</b>
                            <p style="margin: 6px 0; font-size: 13px; color: #555; line-height: 1.5;">${p.desc}</p>
                            <small style="color: #999; font-size: 11px;">来源：${p.source}</small>
                        </div>
                    `;
                    layer.bindPopup(popupHTML, { maxWidth: 260 });
                    layer.bindTooltip(`${p.year} · ${p.title}`);
                }
            });

            currentTimeLayer = L.timeDimension.layer.geoJson(currentGeoJsonLayer, {
                updateTimeDimension: true, 
                addlastPoint: true, 
                waitForReady: true
            });
            currentTimeLayer.addTo(map);
        }

        // ==========================================
        // 7. 主流程与事件监听
        // ==========================================
        fetch('events.json')
            .then(response => response.json())
            .then(events => {
                allEvents = events;
                renderData(allEvents); // 初次渲染

                // 添加右上角图例
                const legend = L.control({ position: 'topright' });
                legend.onAdd = function (map) {
                    const div = L.DomUtil.create('div', 'legend');
                    div.innerHTML += '<b>事件类型</b><br>';
                    div.innerHTML += '<i style="background: #007bff"></i>交通<br>';
                    div.innerHTML += '<i style="background: #dc3545"></i>规划<br>';
                    div.innerHTML += '<i style="background: #28a745"></i>文化';
                    return div;
                };
                legend.addTo(map);

                // 监听搜索框
                document.getElementById('search-input').addEventListener('input', function(e) {
                    const keyword = e.target.value.trim();
                    if (keyword === '') { 
                        renderData(allEvents); 
                    } else {
                        const filtered = allEvents.filter(item => 
                            item.title.includes(keyword) || item.desc.includes(keyword) || item.category.includes(keyword)
                        );
                        renderData(filtered);
                    }
                });

                // 时间轴联动图表颜色
                map.timeDimension.on('timeload', function(e) {
                    const keyword = document.getElementById('search-input').value.trim();
                    const currentData = keyword === '' ? allEvents : allEvents.filter(item => 
                        item.title.includes(keyword) || item.desc.includes(keyword) || item.category.includes(keyword)
                    );
                    updateChartData(currentData);
                });

                // 点击图表联动时间轴
                myChart.off('click');
                myChart.on('click', function (params) {
                    const clickedYear = parseInt(params.name);
                    const targetDate = new Date(`${clickedYear}-01-01T00:00:00`);
                    map.timeDimension.setCurrentTime(targetDate.getTime());
                });
            })
            .catch(error => console.error('加载 events.json 失败:', error));

        // 窗口自适应
        window.addEventListener('resize', function() { 
            myChart.resize(); 
        });
    </script>
</body>
</html>
