<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>西安城市发展时间线</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.control.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.css" />
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="exit-cinema-btn">✖ 退出演示</button>
    <button id="exit-dashboard-btn">✖ 退出大屏</button>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>正在计算城市发展热度...</div>
    </div>

    <header id="top-bar">
        <h1>🗺️ 西安城市发展档案</h1>
        <div class="controls">
            <input type="text" id="search-input" placeholder="搜索关键词...">
            <div class="category-filters">
                <label><input type="checkbox" class="cat-filter" value="交通" checked> <span style="color:#007bff;">交通</span></label>
                <label><input type="checkbox" class="cat-filter" value="规划" checked> <span style="color:#dc3545;">规划</span></label>
                <label><input type="checkbox" class="cat-filter" value="文化" checked> <span style="color:#28a745;">文化</span></label>
                <label><input type="checkbox" class="cat-filter" value="经济" checked> <span style="color:#6f42c1;">经济</span></label>
                <label><input type="checkbox" class="cat-filter" value="生态" checked> <span style="color:#17a2b8;">生态</span></label>
                <label><input type="checkbox" class="cat-filter" value="区划" checked> <span style="color:#fd7e14;">区划</span></label>
                <label><input type="checkbox" class="cat-filter" value="政策" checked> <span style="color:#e83e8c;">政策</span></label>
            </div>
            <label class="heat-toggle">
                <input type="checkbox" id="heat-mode-toggle"> 🔥 热力图
            </label>
            
            <!-- ✨ 新增按钮 -->
            <button id="policy-btn" class="action-btn">📑 政策库</button>
            <button id="fullscreen-btn" class="action-btn">🖥️ 大屏模式</button>
            <button id="swipe-btn" class="action-btn">🪞 古今对比</button>
            <button id="ai-slice-btn" class="action-btn">✨ AI 时代切片</button>
            <button id="cinema-btn" class="action-btn">🎬 自动演示</button>
        </div>
        <div id="stats-text">加载中...</div>
    </header>

    <div id="side-panel">
        <div id="close-panel">×</div>
        <img id="panel-img" src="" alt="历史图片">
        <h2 id="panel-title"></h2>
        <div class="panel-meta">
            <span id="panel-year"></span>
            <span id="panel-category"></span>
            <span>来源：<span id="panel-source"></span></span>
        </div>
        <p id="panel-desc"></p>
            <a id="panel-link" href="#" target="_blank" style="display:none; margin-top:15px; padding:8px 15px; background:#007bff; color:#fff; text-decoration:none; border-radius:5px; font-size:14px; text-align:center;">阅读原文</a>
        <!-- ✨ 新增：生成海报按钮 -->
        <button id="poster-btn" style="margin-top:15px; width:100%; padding:10px; background:#28a745; color:#fff; border:none; border-radius:5px; font-size:15px; font-weight:bold; cursor:pointer; transition:0.3s;">📸 生成专属档案海报</button>
    </div>

    <!-- ✨ 新增：政策库弹窗 -->
    <div id="policy-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📑 西安市政府政策文档库</h2>
                <span id="close-policy" class="close-btn">&times;</span>
            </div>
            <div class="policy-list" id="policy-list-container">
                <!-- 列表由 JS 动态生成 -->
            </div>
        </div>
    </div>

    <div id="map"></div>
    
    <div id="bottom-panel">
        <div id="bar-chart"></div>
        <div id="pie-chart"></div>
        <!-- ✨ 新增：宏观经济折线图 -->
        <div id="line-chart"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/iso8601-js-period@0.2.1/iso8601.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.min.js"></script>
    <script src="echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-ant-path@1.3.0/dist/leaflet-ant-path.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
     <!-- ✨ 隐藏的海报生成容器 -->
 <div id="poster-template" style="position: fixed; left: -9999px; top: -9999px; width: 500px; height: 700px; background: #fff; padding: 30px; box-sizing: border-box; font-family: sans-serif; display: flex; flex-direction: column;">
     <div style="font-size: 12px; color: #888; letter-spacing: 2px; margin-bottom: 5px;">XI'AN CITY DEVELOPMENT ARCHIVE</div>
     <div style="font-size: 26px; font-weight: bold; color: #222; margin-bottom: 20px;" id="poster-title">事件标题</div>
     <div style="display: flex; gap: 10px; margin-bottom: 20px;">
         <span style="background: #f0f0f0; padding: 4px 10px; border-radius: 12px; font-size: 13px; color: #555;" id="poster-year">年份</span>
         <span style="background: #f0f0f0; padding: 4px 10px; border-radius: 12px; font-size: 13px; color: #555;" id="poster-cat">分类</span>
     </div>
     <div style="flex: 1; font-size: 16px; color: #444; line-height: 1.8; margin-bottom: 20px; overflow: hidden;" id="poster-desc">描述</div>
     <div style="height: 250px; width: 100%; border-radius: 8px; background: #eee; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;" id="poster-map-container"></div>
     <div style="display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid #eee; padding-top: 15px;">
         <div>
             <div style="font-size: 14px; font-weight: bold; color: #333;">🗺️ 西安城市发展档案</div>
             <div style="font-size: 12px; color: #888;">扫码查看交互地图</div>
         </div>
         <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://xian717557.github.io/xian-timeline/" alt="QR Code" style="width: 70px; height: 70px;">
     </div>
 </div>
     <!-- ✨ 电影级字幕层 -->
    <div id="cinema-text-overlay" style="display:none; position:fixed; bottom:15vh; left:0; width:100%; text-align:center; z-index:9999; pointer-events:none; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.8);">
        <h1 id="cinema-year" style="font-size: 48px; margin: 0; font-weight: 900; letter-spacing: 5px;">2024 年</h1>
        <p id="cinema-event" style="font-size: 24px; margin-top: 10px; font-family: serif;">事件标题</p>
    </div>
    <!-- 作为入口启动模块化项目 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
