<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西安城市发展时间线</title>
    
    <!-- 1. Leaflet 核心样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
        <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- 2. TimeDimension 插件样式和依赖 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.control.min.css" />
    
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        /* 地图占上面 70% 的高度 */
        #map { height: 70vh; width: 100%; }
        /* 图表占下面 30% 的高度 */
        #chart { height: 30vh; width: 100%; background: #fff; }
     /* 图例样式 */
.legend {
    background: white;
    padding: 10px;
    border-radius: 5px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.4);
    line-height: 1.5;
    font-size: 14px;
}
.legend i {
    width: 12px;
    height: 12px;
    float: left;
    margin-right: 8px;
    margin-top: 4px;
    border-radius: 50%;
}   
    </style>
</head>
<body>
    <!-- 地图容器 -->
    <div id="map"></div>
    <!-- 地图容器 -->
    <div id="map"></div>
    <!-- 图表容器 -->
    <div id="chart"></div>
    <!-- 3. Leaflet 核心 JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 4. TimeDimension 插件依赖的 JS -->
    <script src="https://cdn.jsdelivr.net/npm/iso8601-js-period@0.2.1/iso8601.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-timedimension@1.1.1/dist/leaflet.timedimension.min.js"></script>
    
    <!-- 5. 我们的业务代码 -->
    <script>
        // --- 1. 初始化地图 ---
        const map = L.map('map', {
            center: [34.3416, 108.9398],
            zoom: 11,
            timeDimension: true,
            timeDimensionControl: true,
            timeDimensionControlOptions: {
                position: 'bottomleft',
                autoPlay: false,
                minSpeed: 1,
                maxSpeed: 10,
                timeSliderDragUpdate: true,
                loop: false
            }
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // --- 2. 初始化 ECharts 实例 ---
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        
        // 用来存放全局的数据和图表实例
        let allEvents = [];
        let geojsonData = null;

        // --- 3. 核心函数：渲染/更新 ECharts 柱状图 ---
        // 参数 currentYear 是地图时间轴当前所在的年份
        function updateChart(currentYear) {
            // 统计每一年的数据量
            const yearCounts = {};
            allEvents.forEach(e => {
                yearCounts[e.year] = (yearCounts[e.year] || 0) + 1;
            });
            
            // 提取年份和对应的数量，按年份排序
            const years = Object.keys(yearCounts).sort((a, b) => a - b);
            const counts = years.map(y => yearCounts[y]);

            // 设置 ECharts 的配置
            const option = {
                title: { text: '西安城市发展事件年份分布', left: 'center', textStyle: { fontSize: 14 } },
                tooltip: { trigger: 'axis' },
                grid: { left: '5%', right: '5%', bottom: '10%', top: '20%', containLabel: true },
                xAxis: { 
                    type: 'category', 
                    data: years,
                    axisLabel: { interval: 0 } // 强制显示所有年份
                },
                yAxis: { type: 'value', minInterval: 1 }, // 只显示整数
                series: [{
                    name: '事件数',
                    type: 'bar',
                    data: counts,
                    // 判断当前柱子是不是地图时间轴所在的年份，如果是就变色
                    itemStyle: {
                        color: function(params) {
                            const year = parseInt(years[params.dataIndex]);
                            // 如果当前柱子的年份 <= 时间轴的年份，显示蓝色，否则显示灰色
                            return year <= currentYear ? '#5470c6' : '#e0e0e0';
                        }
                    },
                    barMaxWidth: 40
                }]
            };
            // 绑定点击事件：点击柱子，地图时间轴跳转
myChart.off('click'); // 先解绑之前的，防止重复触发
myChart.on('click', function (params) {
    const clickedYear = parseInt(params.name); // 获取点击的年份
    // 构造该年的日期时间戳（1月1日）
    const targetDate = new Date(`${clickedYear}-01-01T00:00:00`);
    // 调用插件 API 跳转时间
    map.timeDimension.setCurrentTime(targetDate.getTime());
});
            myChart.setOption(option);
        }

        // --- 4. 将 events 数组转换为 GeoJSON ---
        function eventsToGeoJSON(events) {
            return {
                type: 'FeatureCollection',
                features: events.map(e => ({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [e.lng, e.lat] },
                    properties: {
                        time: `${e.year}-01-01`,
                        title: e.title,
                        year: e.year,
                        category: e.category,
                        desc: e.desc,
                        source: e.source
                    }
                }))
            };
        }

        // --- 5. 加载数据并启动 ---
        fetch('events.json')
            .then(response => response.json())
            .then(events => {
                allEvents = events;
                geojsonData = eventsToGeoJSON(events);

                // 初始化图表（传入起始年份，比如最早的 2011）
                updateChart(2011);

                // 创建地图图层
// 定义颜色映射规则
function getColor(category) {
    if (category === '交通') return '#007bff'; // 蓝色
    if (category === '规划') return '#dc3545'; // 红色
    if (category === '文化') return '#28a745'; // 绿色
    return '#6c757d'; // 默认灰色
}

const geoJsonLayer = L.geoJSON(geojsonData, {
    // 新增 pointToLayer 属性，自定义标记的样式
    pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
            radius: 8,              // 圆圈大小
            fillColor: getColor(feature.properties.category),
            color: '#fff',          // 圆圈边框颜色
            weight: 2,              // 边框粗细
            opacity: 1,
            fillOpacity: 0.8
        });
    },
    onEachFeature: function (feature, layer) {
        const p = feature.properties;
        const popupHTML = `<b>${p.year} · ${p.title}</b><br>${p.desc}<br><small>来源：${p.source}</small>`;
        layer.bindPopup(popupHTML);
        layer.bindTooltip(`${p.year} · ${p.title}`);
    }
});

                // 包装成时间图层
                const timeLayer = L.timeDimension.layer.geoJson(geoJsonLayer, {
                    updateTimeDimension: true,
                    addlastPoint: true,
                    waitForReady: true
                });

                timeLayer.addTo(map);
// 添加图例
const legend = L.control({ position: 'topright' });
legend.onAdd = function (map) {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>事件类型</b><br>';
    div.innerHTML += '<i style="background: #007bff"></i>交通<br>';
    div.innerHTML += '<i style="background: #dc3545"></i>规划<br>';
    div.innerHTML += '<i style="background: #28a745"></i>文化';
    return div;
};
legend.addTo(map);
                // --- 6. 终极联动：监听地图时间轴的变化 ---
                // 当地图的时间轴发生变动时，重新渲染柱状图
                map.timeDimension.on('timeload', function(e) {
                    // 获取当前时间轴的日期对象
                    const currentDate = new Date(map.timeDimension.getCurrentTime());
                    const currentYear = currentDate.getFullYear();
                    // 更新图表
                    updateChart(currentYear);
                });

            })
            .catch(error => console.error('加载 events.json 失败:', error));

        // --- 7. 窗口大小改变时，图表自适应 ---
        window.addEventListener('resize', function() {
            myChart.resize();
        });
    </script>
</body>
</html>
